<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>师茹靖 & 陈亚龙 - 星轨相册</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #030303;
            color: #fff;
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 背景星空 */
        .stars {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffb3c6, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.2;
            z-index: 1;
            animation: drift 60s linear infinite;
        }
        @keyframes drift { from { background-position: 0 0; } to { background-position: -200px 200px; } }

        /* 顶部进度 */
        #progress {
            position: absolute; top: 30px; right: 40px;
            font-size: 1.2em; color: #ffb3c6; letter-spacing: 3px;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.8);
            z-index: 10; transition: opacity 0.5s;
        }

        /* 第一幕：星辰散落 */
        #collect-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; transition: opacity 0.5s; }

        /* 【全新质感】真正的星光 */
        .star-dust {
            position: absolute;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            /* 悬浮 + 缓慢旋转动画 */
            animation: starFloat 6s ease-in-out infinite alternate;
        }

        /* 核心光晕 */
        .star-core {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            /* 使用传入的颜色变量，中心纯白，边缘散开 */
            background: radial-gradient(circle, #ffffff 0%, var(--c, #ff4d6d) 30%, transparent 70%);
            filter: blur(1.5px); /* 柔化边缘 */
        }

        /* 十字星芒 - 横 */
        .star-cross-h {
            position: absolute; width: 250%; height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff 50%, transparent);
            opacity: 0.8;
        }
        /* 十字星芒 - 竖 */
        .star-cross-v {
            position: absolute; width: 2px; height: 250%;
            background: linear-gradient(180deg, transparent, #ffffff 50%, transparent);
            opacity: 0.8;
        }

        /* 交互：鼠标悬浮时星光爆闪变大 */
        .star-dust:hover {
            transform: scale(1.3);
            transition: transform 0.2s ease-out;
            z-index: 10;
        }
        .star-dust:hover .star-core { filter: blur(2px); box-shadow: 0 0 20px #fff; }
        .star-dust:hover .star-cross-h, .star-dust:hover .star-cross-v { opacity: 1; height: 3px; }

        @keyframes starFloat {
            0% { transform: translateY(-15px) rotate(0deg) scale(0.95); }
            100% { transform: translateY(15px) rotate(15deg) scale(1.05); }
        }

        /* 底部提示文字 */
        #hint {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            font-size: 1.1em; letter-spacing: 3px; text-align: center;
            color: #aaa; text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
            z-index: 100; pointer-events: none;
            transition: opacity 1s;
            animation: pulse 2s infinite;
        }
        #hint span { font-size: 0.8em; color: #666; display: block; margin-top: 5px; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* 第二幕：照片飞出 */
        .photo-card {
            position: absolute; width: 120px; height: 120px;
            border-radius: 50%; object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            opacity: 0; transform: scale(0) translateY(50px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 15; pointer-events: none;
        }
        .photo-card.show { opacity: 1; transform: scale(1) translateY(0); }

        /* 第三幕：3D 星轨 */
        #orbit-stage {
            position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            perspective: 1000px; z-index: 20; display: none;
            cursor: grab;
            transition: transform 0.8s cubic-bezier(0.5, 0, 0.2, 1), opacity 0.8s ease-in;
        }
        #orbit-stage:active { cursor: grabbing; }
        #orbit-container {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
        }
        .orbit-photo {
            position: absolute; width: 100px; height: 100px;
            margin-left: -50px; margin-top: -50px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid #ffb3c6; box-shadow: 0 0 15px #ff4d6d;
            transition: all 0.5s ease-out;
        }

        /* 第四幕：光耀爱心 */
        #final-heart {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 160px; color: #ff4d6d;
            text-shadow: 0 0 30px #ff4d6d, 0 0 80px #ff4d6d, 0 0 120px #ff4d6d;
            opacity: 0; z-index: 25; pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.5), opacity 0.5s ease-out;
        }
        #final-heart.beat { animation: heart-beat 1.5s infinite 0.8s; }
        @keyframes heart-beat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* 第五幕：优雅文字 */
        #blessing {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 999;
            opacity: 0; pointer-events: none;
            transition: opacity 1s ease-in;
            width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #blessing.show { opacity: 1; }

        #blessing h2, #blessing p {
            opacity: 0; transform: translateY(20px); filter: blur(10px);
        }

        #blessing.show h2 { animation: elegantReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        #blessing.show p { animation: elegantReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: 0.8s; }

        @keyframes elegantReveal {
            0% { opacity: 0; transform: translateY(20px); filter: blur(10px); text-shadow: 0 0 0 #ff4d6d; }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); text-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d; }
        }

        #blessing h2 { font-size: 3.5em; color: #fff; letter-spacing: 10px; margin-bottom: 10px; }
        #blessing p { font-size: 1.5em; color: #ffb3c6; letter-spacing: 8px; }

        /* 彩蛋暗号 */
        #secret-hint {
            position: absolute; bottom: 20px; left: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px; color: rgba(255, 179, 198, 0.4);
            letter-spacing: 1px; opacity: 0;
            transition: opacity 2s ease-in;
            z-index: 1000; cursor: default;
        }
        #secret-hint.blink { animation: hintBlink 3s infinite alternate; }
        @keyframes hintBlink { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }

        /* 彩蛋：花瓣 */
        .petal {
            position: absolute; top: -20px;
            width: 15px; height: 15px;
            background: #ffb3c6; border-radius: 15px 0 15px 0;
            opacity: 0; z-index: 1000; pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            #blessing h2 { font-size: 2.2em; letter-spacing: 5px; }
            #blessing p { font-size: 1.2em; letter-spacing: 4px; }
            #final-heart { font-size: 120px; }
            #secret-hint { bottom: 10px; left: 10px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div id="progress">回忆收集: 0 / 13</div>

    <div id="hint">拨开星尘，寻找我们的回忆<span>（点击发光的光球）</span></div>

    <div id="collect-area"></div>

    <div id="orbit-stage">
        <div id="orbit-container"></div>
    </div>

    <div id="final-heart">❤</div>

    <div id="blessing">
        <h2>师茹靖 ❤ 陈亚龙</h2>
        <p>新婚快乐 · 百年好合</p>
    </div>

    <div id="secret-hint">// sys.log: 尝试连续点击爱心 3 次_</div>

    <script>
        const totalPhotos = 13;
        let collectedCount = 0;
        const collectArea = document.getElementById('collect-area');
        const progressText = document.getElementById('progress');
        const hintText = document.getElementById('hint');
        const orbitStage = document.getElementById('orbit-stage');
        const orbitContainer = document.getElementById('orbit-container');
        const blessing = document.getElementById('blessing');
        const finalHeart = document.getElementById('final-heart');
        const secretHint = document.getElementById('secret-hint');

        const isMobile = window.innerWidth < 768;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        // 泊松盘采样
        const positions = [];
        const minDist = isMobile ? 80 : 150;
        const margin = isMobile ? 40 : 100;
        const centerSafe = isMobile ? 120 : 200;

        while (positions.length < totalPhotos) {
            const x = Math.random() * (window.innerWidth - margin * 2) + margin;
            const y = Math.random() * (window.innerHeight - margin * 2) + margin;

            const distToCenter = Math.hypot(x - centerX, y - centerY);
            if (distToCenter < centerSafe) continue;

            let tooClose = false;
            for(let pos of positions) {
                if (Math.hypot(x - pos.x, y - pos.y) < minDist) {
                    tooClose = true;
                    break;
                }
            }
            if (!tooClose) positions.push({ x, y });
        }

        // 高级色系：粉红、香槟金、淡紫
        const colors = ['#ff4d6d', '#ffb3c6', '#d8b4e2', '#ffd700'];

        positions.forEach((pos, i) => {
            const star = document.createElement('div');
            star.className = 'star-dust';
            star.style.left = `${pos.x}px`;
            star.style.top = `${pos.y}px`;

            // 随机大小
            const size = 40 + Math.random() * 40;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.marginLeft = `${-size / 2}px`;
            star.style.marginTop = `${-size / 2}px`;

            // 随机动画延迟
            star.style.animationDelay = `${Math.random() * 2}s`;

            // 随机颜色变量传给内部
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            star.style.setProperty('--c', randomColor);

            // 构建星光结构
            star.innerHTML = `
                <div class="star-core"></div>
                <div class="star-cross-h"></div>
                <div class="star-cross-v"></div>
            `;

            star.addEventListener('pointerdown', (e) => {
                star.style.pointerEvents = 'none';
                collectStar(star, i + 1, e.clientX, e.clientY);
            });

            collectArea.appendChild(star);
        });

        function collectStar(starElement, index, clickX, clickY) {
            // 爆闪一下再消失
            starElement.style.transform = 'scale(2)';
            starElement.style.opacity = '0';
            setTimeout(() => { starElement.style.display = 'none'; }, 200);

            collectedCount++;
            progressText.innerText = `回忆收集: ${collectedCount} / ${totalPhotos}`;

            const img = document.createElement('img');
            img.src = `${index}.jpg`;
            img.className = 'photo-card';

            if (isMobile) {
                img.style.left = `calc(50vw - 60px)`;
                img.style.top = `calc(60vh - 60px)`;
            } else {
                img.style.left = `${clickX - 60}px`;
                img.style.top = `${clickY - 60}px`;
            }

            document.body.appendChild(img);
            setTimeout(() => { img.classList.add('show'); }, 50);

            setTimeout(() => {
                img.style.opacity = '0';
                img.style.transform = 'scale(0.5) translateY(-100px)';
                setTimeout(() => img.remove(), 1000);
            }, 2000);

            if (collectedCount === totalPhotos) {
                hintText.innerHTML = '回忆已集齐<span>点击屏幕，开启最终星轨</span>';
                document.body.addEventListener('pointerdown', startFinalOrbit, { once: true });
            }
        }

        let angleY = 0;
        let autoRotate = true;
        let rotateAnimationId;
        let isDragging = false;
        let startX = 0;

        function startFinalOrbit() {
            hintText.style.opacity = '0';
            collectArea.style.display = 'none';

            const radius = isMobile ? 120 : 180;

            for (let i = 1; i <= totalPhotos; i++) {
                const img = document.createElement('img');
                img.src = `${i}.jpg`;
                img.className = 'orbit-photo';
                img.style.width = isMobile ? '70px' : '100px';
                img.style.height = isMobile ? '70px' : '100px';
                img.style.marginLeft = isMobile ? '-35px' : '-50px';
                img.style.marginTop = isMobile ? '-35px' : '-50px';

                const angle = (i / totalPhotos) * 360;
                img.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
                img.style.opacity = '0';

                orbitContainer.appendChild(img);
                setTimeout(() => { img.style.opacity = '1'; }, i * 100);
            }

            orbitStage.style.display = 'block';

            setTimeout(() => {
                hintText.innerHTML = '滑动可拨动星轨<span>点击中心，引爆爱心</span>';
                hintText.style.opacity = '1';
            }, 1500);

            orbitStage.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
                autoRotate = false;
                orbitStage.style.cursor = 'grabbing';
            });

            window.addEventListener('pointermove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - startX;
                    angleY += deltaX * 0.5;
                    startX = e.clientX;
                    orbitContainer.style.transform = `rotateY(${angleY}deg) rotateX(10deg)`;
                }
            });

            window.addEventListener('pointerup', () => {
                if (isDragging) {
                    isDragging = false;
                    orbitStage.style.cursor = 'grab';
                    setTimeout(() => { if(!isDragging) autoRotate = true; }, 2000);
                }
            });

            function rotateRing() {
                if (autoRotate && !isDragging) {
                    angleY += 0.3;
                    orbitContainer.style.transform = `rotateY(${angleY}deg) rotateX(10deg)`;
                }
                rotateAnimationId = requestAnimationFrame(rotateRing);
            }
            rotateRing();

            orbitStage.addEventListener('pointerdown', () => {
                if(blessing.classList.contains('show')) return;

                cancelAnimationFrame(rotateAnimationId);
                orbitStage.style.transform = 'scale(0.05) rotate(180deg)';
                orbitStage.style.opacity = '0';
                hintText.style.display = 'none';

                setTimeout(() => {
                    finalHeart.style.opacity = '1';
                    finalHeart.style.transform = 'translate(-50%, -50%) scale(1)';
                    finalHeart.classList.add('beat');
                }, 800);

                setTimeout(() => {
                    finalHeart.style.opacity = '0.15';
                    blessing.classList.add('show');

                    setTimeout(() => {
                        secretHint.classList.add('blink');
                    }, 4000);

                }, 2200);
            }, { once: true });
        }

        let heartClicks = 0;
        let clickTimer;

        finalHeart.style.pointerEvents = 'none';
        setTimeout(() => {
            finalHeart.style.pointerEvents = 'auto';
        }, 1000);

        finalHeart.addEventListener('click', () => {
            heartClicks++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { heartClicks = 0; }, 2000);

            if (heartClicks === 3) {
                triggerPetalRain();
                secretHint.style.opacity = '0';
                heartClicks = 0;
            }
        });

        function triggerPetalRain() {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.style.left = `${Math.random() * 100}vw`;
                    petal.style.animationDuration = `${Math.random() * 2 + 3}s`;
                    document.body.appendChild(petal);
                    setTimeout(() => petal.remove(), 5000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
